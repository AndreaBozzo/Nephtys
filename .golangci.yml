# golangci-lint configuration for Nephtys (v2 schema).
# Conservative starting set — catches real issues without flagging style noise.
# Run locally: `make lint` (or `golangci-lint run`).
# Migrated from v1 with `golangci-lint migrate` because v1.x is built against
# Go 1.24 and refuses to load configs targeting Go 1.25+.
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gocritic
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
