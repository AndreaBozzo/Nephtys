global:
  scrape_interval: 5s

scrape_configs:
  # One target covers both ways of running Nephtys against this stack, because
  # both end up bound to port 3002 on the host:
  #
  #   make run                                  a binary on the host
  #   docker compose --profile nephtys up -d    the optional in-compose service,
  #                                             which publishes 3002:3002
  #
  # host.docker.internal resolves on Linux too, via the host-gateway alias the
  # prometheus service declares in compose.yml.
  #
  # Listing the in-compose service separately as `nephtys:3002` was the obvious
  # alternative and the wrong one: that name only exists under a profile the
  # default `docker compose up -d` does not enable, so the default path always
  # showed one DOWN target. A row that is red by design is worse than no row —
  # it teaches an operator that red on this page means nothing. With a single
  # target, DOWN means what it says: nothing is serving metrics on 3002.
  #
  # The two modes cannot both be up anyway — they would contend for the same
  # host port — so nothing is lost by not distinguishing them here. The Grafana
  # dashboard's "Instance" variable is derived from the metrics themselves
  # rather than from this file, and is unaffected either way.
  - job_name: 'nephtys'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:3002'
