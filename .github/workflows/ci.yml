name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main. A branch stacked on
  # another feature branch is still a change that has to build, lint and pass
  # its tests; with a base filter it silently got no CI at all until the branch
  # under it merged, which is exactly when the result stops being useful.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: go.sum

    - name: Check formatting
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout=3m

    - name: Build
      run: go build -v ./...

    - name: Validate example configs
      run: make check-examples

    - name: Test
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
